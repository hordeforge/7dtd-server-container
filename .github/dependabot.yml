---
# Keeps the three dependency surfaces of this repo current:
# - github-actions: the checkout and setup-uv SHA pins in ci.yml
# - pip: requirements-lint.txt (hashed analyzer toolchain; PRs must keep
#   hashes in sync, see the header comment in that file)
# - docker: the base image in Containerfile. It tracks the `:latest` tag, so
#   without this entry a rebuild on the server host silently picks up a
#   different image than the one the tree was last reviewed against.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
