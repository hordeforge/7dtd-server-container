---
name: release

# Tag-driven releases (hordeforge/.github REPOSITORY_STANDARDS.md, §8): a
# vX.Y.Z tag must agree with the version this repository actually ships, so a
# mistyped or forgotten bump is rejected instead of becoming a release nobody
# can reproduce. The tag must also have a dated CHANGELOG section, so a release
# cannot ship with its notes still under Unreleased.
#
# The container image is deliberately NOT built or pushed here. It is built on
# the LAN server host from this tree by `scripts/run.sh build`, against that
# host's own podman and storage; publishing one from a hosted runner would
# claim an artifact nobody deploys. Gating the tag is the half that can be
# proven automatically.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One verification per tag. A force-pushed or re-created tag is a new run, and
# a superseded run finishing after the current one would report a verdict for a
# commit that is no longer the tag: the log's newest conclusion is then the one
# for the old SHA. Cancelling the older run keeps the last word on the tag the
# repository actually points at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to the release commit, not the mutable v7 tag: a moved tag
      # would otherwise run unreviewed code here with the workflow token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Same action SHA and same uv binary as the ci workflow's check job: the
      # inventory step below reads licenses out of the venv, and `make sbom`
      # builds that venv from requirements-lint.txt with the interpreter pin in
      # .python-version.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.12.14"
          enable-cache: true
          cache-dependency-glob: "{requirements-lint.txt,.python-version}"

      - name: Check the tag matches VERSION
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          MANIFEST="VERSION"
          case "$TAG" in
            v*) ;;
            *) echo "ERROR: tag '$TAG' does not start with 'v'" >&2; exit 1 ;;
          esac
          SHIPPED="$(tr -d '[:space:]' < "$MANIFEST")"
          if [ -z "$SHIPPED" ]; then
            echo "ERROR: $MANIFEST is empty" >&2
            exit 1
          fi
          if [ "$SHIPPED" != "${TAG#v}" ]; then
            echo "ERROR: tag $TAG but $MANIFEST ships $SHIPPED;" >&2
            echo "       make them match before tagging" >&2
            exit 1
          fi
          echo "ok: tag $TAG matches $MANIFEST ($SHIPPED)"

      # What this release was resolved against. The analyzer closure is the
      # only third-party code in the tree, and it never reaches the image, so
      # the inventory is the record of a release's dev-time supply chain. It
      # goes in the run summary rather than a committed file: the document is
      # a pure function of requirements-lint.txt, so anyone can reproduce it
      # with `make sbom` at the tag, and a copy in the tree would only be a
      # second thing to forget to regenerate.
      - name: Record the dependency inventory
        shell: bash
        run: |
          set -euo pipefail
          make sbom
          {
            echo "## Dependency inventory ($TAG)"
            echo
            echo '```json'
            cat dist/sbom.cdx.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A matching VERSION says the tag is the version this tree ships; it
      # says nothing about whether anyone can tell what changed. Require the
      # release section too, so a tag cannot ship with an empty or still-
      # Unreleased changelog.
      - name: Check the changelog has a section for the tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -Eq "^## \[$VERSION\] - " CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md has no '## [$VERSION] - <date>' section;" >&2
            echo "       move the Unreleased entries under it and date it before tagging" >&2
            exit 1
          fi
          echo "ok: CHANGELOG.md has a section for $VERSION"
