---
name: release

# Tag-driven releases (hordeforge/.github REPOSITORY_STANDARDS.md, §8): a
# vX.Y.Z tag must agree with the version this repository actually ships, so a
# mistyped or forgotten bump is rejected instead of becoming a release nobody
# can reproduce. The tag must also have a dated CHANGELOG section, so a release
# cannot ship with its notes still under Unreleased, must be newer than every
# version that changelog already releases, and a section that declares breaking
# changes must ship as a major release.
#
# The container image is deliberately NOT built or pushed here. It is built on
# the LAN server host from this tree by `scripts/run.sh build`, against that
# host's own podman and storage; publishing one from a hosted runner would
# claim an artifact nobody deploys. Gating the tag is the half that can be
# proven automatically.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One verification per tag. A force-pushed or re-created tag is a new run, and
# a superseded run finishing after the current one would report a verdict for a
# commit that is no longer the tag: the log's newest conclusion is then the one
# for the old SHA. Cancelling the older run keeps the last word on the tag the
# repository actually points at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to the release commit, not the mutable v7 tag: a moved tag
      # would otherwise run unreviewed code here with the workflow token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Same action SHA and same uv binary as the ci workflow's check job: the
      # inventory step below reads licenses out of the venv, and `make sbom`
      # builds that venv from uv.lock with the interpreter pin in
      # .python-version.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.14"
          enable-cache: true
          cache-dependency-glob: "{uv.lock,.python-version}"

      # The rules live in scripts/check_release_gate.sh, not here: the same
      # script is what scripts/test_release_gate.py pins, so a rule cannot
      # exist in CI that no test covers. It checks the tag against VERSION,
      # requires a dated changelog section, refuses a tag older than a version
      # the changelog already releases, and refuses a section that groups its
      # entries under "### Breaking changes" unless the tag is a major bump.
      - name: Release gate
        shell: bash
        run: scripts/check_release_gate.sh "${GITHUB_REF_NAME}" "${GITHUB_WORKSPACE}"

      # What this release was resolved against. The analyzer closure is the
      # only third-party code in the tree, and it never reaches the image, so
      # the inventory is the record of a release's dev-time supply chain. It
      # goes in the run summary rather than a committed file: the document is
      # a pure function of uv.lock, so anyone can reproduce it
      # with `make sbom` at the tag, and a copy in the tree would only be a
      # second thing to forget to regenerate.
      - name: Record the dependency inventory
        shell: bash
        run: |
          set -euo pipefail
          make sbom
          {
            echo "## Dependency inventory (${GITHUB_REF_NAME})"
            echo
            echo '```json'
            cat dist/sbom.cdx.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
