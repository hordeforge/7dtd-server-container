---
name: ci

on: [push, pull_request]

# Least privilege by default: the lint/test/check job needs no token access.
# The badge job below overrides this with contents: write for its push.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the release commit, not the mutable v7 tag: a moved tag
      # would otherwise run unreviewed code here with the workflow token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install pinned Python analyzers
        # Same versions as the local dev machine so `make lint` enforces
        # identical rules here and locally. requirements-lint.txt carries the
        # full closure (transitives included) with PyPI sha256 hashes;
        # --require-hashes turns any mismatch into a hard failure.
        # (shellcheck and bash come with the runner image and are not pinned;
        # expect minor version drift there.)
        run: >
          python3 -m pip install --disable-pip-version-check
          --require-hashes -r requirements-lint.txt

      - name: Lint shell + Python + workflow YAML + Containerfile (make lint)
        # make lint owns every check (bash -n, shellcheck, reference
        # integrity, ruff rules/format, mypy strict, yamllint, Containerfile
        # structure); running it here instead of inlining keeps CI from
        # drifting from dev.
        run: make lint

      - name: Test suites (.env loader, render contracts, lifecycle scripts)
        # Each suite pins its own contract; scripts/test_lib_env.sh covers the
        # .env loader, password rules, and telnet_session (make coverage reruns
        # that one under kcov). Running everything via make test keeps CI from
        # drifting from dev.
        run: make test

      # Raw + rendered template validation lives only in make test
      # (scripts/test_config_templates.py pins the token contract); no inline
      # copy here, same single-owner rule as lint above.

  coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Same SHA pin as the check job above; see the comment there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # No prebuilt kcov works here: apt has no noble package and the v42
      # tarball links against Ubuntu 22.04's binutils (libopcodes-2.38).
      # Build a pinned release from source instead.
      - name: Build kcov v43 from source
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            cmake libelf-dev libdw-dev libbz2-dev zlib1g-dev libcurl4-openssl-dev binutils-dev
          git clone --depth 1 --branch v43 https://github.com/SimonKagstrom/kcov /tmp/kcov-src
          cmake -S /tmp/kcov-src -B /tmp/kcov-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/kcov-build --parallel 2
          sudo cmake --install /tmp/kcov-build
          kcov --version
      - run: make coverage
      - run: python3 scripts/coverage_badge.py coverage.cobertura.xml "$RUNNER_TEMP/coverage.svg"
      - name: Publish the badge to the badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git clone --depth 1 --branch badges "$url" badge-repo
          else
            git init -q -b badges badge-repo
          fi
          cp "$RUNNER_TEMP/coverage.svg" badge-repo/
          cd badge-repo
          # The clone path already has an origin (the token URL); drop it so
          # this works identically on both the fresh-init and cloned paths.
          git remote remove origin 2>/dev/null || true
          git remote add origin "$url"
          git config user.name "hordeforge-ci"
          git config user.email "ci@hordeforge.noreply.github.com"
          git add coverage.svg
          git diff --cached --quiet || git commit -m "update coverage badge"
          git push origin badges
