---
name: ci

on: [push, pull_request]

# Least privilege by default: the lint/test/check job needs no token access.
# The badge job below overrides this with contents: write for its push.
permissions:
  contents: read

# One run per ref. Without this, two rapid pushes to main race in the badge
# job (both clone the badges branch at the same SHA; the slower push fails
# non-fast-forward and turns main red despite passing checks), and every
# intermediate PR push keeps burning runner minutes behind its successors.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Bounds a hung step (the default is 6 hours): the uv install plus
    # make lint and make test finish well inside this on a healthy runner.
    timeout-minutes: 15
    steps:
      # Pinned to the release commit, not the mutable v7 tag: a moved tag
      # would otherwise run unreviewed code here with the workflow token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # uv is the only Python toolchain here; `make lint` and `make test` build
      # the analyzer venv themselves from the hash-pinned requirements-lint.txt,
      # so this step installs the binary and nothing else. Same SHA-pin rule as
      # checkout above. (shellcheck and bash come with the runner image and are
      # not pinned; expect minor version drift there.)
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Lint shell + Python + workflow YAML + Containerfile (make lint)
        # make lint owns every check (bash -n, shellcheck, reference
        # integrity, ruff rules/format, mypy strict, yamllint, Containerfile
        # structure); running it here instead of inlining keeps CI from
        # drifting from dev.
        run: make lint

      - name: Test suites (.env loader, render contracts, lifecycle scripts)
        # Each suite pins its own contract; scripts/test_lib_env.sh covers the
        # .env loader, password rules, and telnet_session (make coverage reruns
        # that one under kcov). Running everything via make test keeps CI from
        # drifting from dev.
        # Raw + rendered template validation lives only in make test
        # (scripts/test_config_templates.py pins the token contract); no inline
        # copy here, same single-owner rule as lint above.
        run: make test

  coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Same SHA pins as the check job above; see the comments there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      # No prebuilt kcov works here: apt has no noble package and the v42
      # tarball links against Ubuntu 22.04's binutils (libopcodes-2.38).
      # Build kcov from source at the release commit of the v43 tag; same
      # rule as checkout above, a moved tag would otherwise run unreviewed
      # code in a job that holds contents: write. Sources and build tree go
      # under RUNNER_TEMP (disk-backed and cleaned up per job), never /tmp.
      - name: Build kcov v43 from source
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            cmake libelf-dev libdw-dev libbz2-dev zlib1g-dev libcurl4-openssl-dev binutils-dev
          src="$RUNNER_TEMP/kcov-src"
          build="$RUNNER_TEMP/kcov-build"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/SimonKagstrom/kcov
          git -C "$src" fetch -q --depth 1 origin a39874f938ce13f7a65f253120d1ec946b349ffe
          git -C "$src" checkout -q --detach FETCH_HEAD
          # kcov's CMakeLists derives its version from `git describe --tags`,
          # and a --depth 1 fetch by SHA carries no tags: describe fails, the
          # version string comes back empty, and the string(REGEX REPLACE) on
          # it aborts configure. Name the fetched commit locally so describe
          # answers v43; the pin stays the SHA fetched above.
          git -C "$src" tag v43 FETCH_HEAD
          cmake -S "$src" -B "$build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$build" --parallel 2
          sudo cmake --install "$build"
          kcov --version
      - run: make coverage
      - name: Render the coverage badge
        run: >
          uv run --no-project python scripts/coverage_badge.py
          coverage.cobertura.xml "$RUNNER_TEMP/coverage.svg"
      - name: Publish the badge to the badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git clone --depth 1 --branch badges "$url" badge-repo
          else
            git init -q -b badges badge-repo
          fi
          cp "$RUNNER_TEMP/coverage.svg" badge-repo/
          cd badge-repo
          # Clone path: origin already points at the token URL. Fresh-init
          # path: no remote yet. Either way origin ends up at $url.
          git remote add origin "$url" 2>/dev/null || true
          git config user.name "hordeforge-ci"
          git config user.email "ci@hordeforge.noreply.github.com"
          git add coverage.svg
          git diff --cached --quiet || git commit -m "update coverage badge"
          git push origin badges
