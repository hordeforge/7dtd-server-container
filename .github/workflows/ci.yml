name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check shell scripts
        run: |
          set -euo pipefail
          for f in entrypoint.sh start.sh stop.sh scripts/*.sh; do
            bash -n "$f"
            echo "bash -n OK: $f"
          done

      - name: Static-analyze shell scripts (shellcheck)
        run: |
          set -euo pipefail
          for f in entrypoint.sh start.sh stop.sh scripts/*.sh; do
            shellcheck -x "$f"
            echo "shellcheck OK: $f"
          done

      - name: Verify internal script references exist
        run: |
          set -euo pipefail
          for ref in $(grep -hoE 'scripts/[-a-z_]+\.sh' *.sh scripts/*.sh | sort -u); do
            test -f "$ref" || { echo "missing referenced script: $ref" >&2; exit 1; }
          done
          echo "all internal script references exist"

      - name: Test lib-env (.env loader, password rules, telnet_session)
        # scripts/test_lib_env.sh is the single source of truth for these
        # assertions (make coverage runs the same script under kcov); running
        # it here instead of inlining the checks keeps the two from drifting.
        run: make test

      - name: Validate Containerfile structure
        run: |
          set -euo pipefail
          grep -Eq '^FROM[[:space:]]+' Containerfile
          grep -Eq '^COPY[[:space:]]+entrypoint\.sh' Containerfile
          grep -Eq '^COPY[[:space:]]+scripts/lib-env\.sh' Containerfile
          grep -Eq '^ENTRYPOINT[[:space:]]+\[' Containerfile
          test -x entrypoint.sh || { echo "entrypoint.sh is not executable" >&2; exit 1; }
          while read -r kw; do
            case "$kw" in
              FROM|RUN|COPY|ENTRYPOINT|USER) ;;
              *) echo "unknown Containerfile directive: $kw" >&2; exit 1 ;;
            esac
          done < <(awk '/^[A-Z]+[[:space:]]/ {print $1}' Containerfile | sort -u)
          echo "Containerfile OK"

      - name: Validate config XML (raw and rendered)
        run: |
          set -euo pipefail
          python3 scripts/check-config-xml.py \
            config/serverconfig.tmpl.xml config/serveradmin_seed.xml
          sed -e 's|@TELNET_PASSWORD@|retest|g' \
              -e 's|@TELNET_PORT@|8087|g' \
              -e 's|@USERDATA_DIR@|/root/.local/share/7DaysToDie|g' \
              config/serverconfig.tmpl.xml > /tmp/serverconfig.xml
          if grep -q '@' /tmp/serverconfig.xml; then
            echo "unrendered template placeholder left in serverconfig.xml" >&2
            exit 1
          fi
          python3 scripts/check-config-xml.py /tmp/serverconfig.xml

  coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install kcov
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends kcov
      - run: make coverage
      - run: python3 scripts/coverage_badge.py coverage.cobertura.xml "$RUNNER_TEMP/coverage.svg"
      - name: Publish the badge to the badges branch
        run: |
          set -euo pipefail
          url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git clone --depth 1 --branch badges "$url" badge-repo
          else
            git init -q -b badges badge-repo
          fi
          cp "$RUNNER_TEMP/coverage.svg" badge-repo/
          cd badge-repo
          git remote add origin "$url"
          git config user.name "hordeforge-ci"
          git config user.email "ci@hordeforge.noreply.github.com"
          git add coverage.svg
          git diff --cached --quiet || git commit -m "update coverage badge"
          git push origin badges
