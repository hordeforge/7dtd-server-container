name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check shell scripts
        run: |
          set -euo pipefail
          for f in entrypoint.sh start.sh stop.sh scripts/*.sh; do
            bash -n "$f"
            echo "bash -n OK: $f"
          done

      - name: Verify internal script references exist
        run: |
          set -euo pipefail
          for ref in $(grep -hoE 'scripts/[a-z_]+\.sh' *.sh scripts/*.sh | sort -u); do
            test -f "$ref" || { echo "missing referenced script: $ref" >&2; exit 1; }
          done
          echo "all internal script references exist"

      - name: Test .env loader (scripts/lib-env.sh)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/test.env" <<'ENV'
          # comment line

          PLAIN=hello
          DOUBLE="double quoted"
          SINGLE='single'
          EVIL=$(touch ./pwned-marker)
          EMPTY=
          export EXPORTED=yes
          NOEQUALS
          KEY2=a=b
          ENV
          # Values are literal data: no expansion, no command substitution.
          (
            cd "$tmp"
            set -euo pipefail
            source "$GITHUB_WORKSPACE/scripts/lib-env.sh"
            load_env_file test.env
            [[ "${PLAIN:-}" == "hello" ]] || { echo "FAIL: PLAIN" >&2; exit 1; }
            [[ "${DOUBLE:-}" == "double quoted" ]] || { echo "FAIL: DOUBLE quote stripping" >&2; exit 1; }
            [[ "${SINGLE:-}" == "single" ]] || { echo "FAIL: SINGLE quote stripping" >&2; exit 1; }
            [[ "${EVIL:-}" == '$(touch ./pwned-marker)' ]] || { echo "FAIL: EVIL must stay literal" >&2; exit 1; }
            [[ ! -e ./pwned-marker ]] || { echo "FAIL: .env value was executed" >&2; exit 1; }
            [[ -z "${EMPTY:-}" && -n "${EMPTY+x}" ]] || { echo "FAIL: EMPTY must be set but empty" >&2; exit 1; }
            [[ "${EXPORTED:-}" == "yes" ]] || { echo "FAIL: export prefix" >&2; exit 1; }
            [[ -z "${NOEQUALS+x}" ]] || { echo "FAIL: lines without = must be skipped" >&2; exit 1; }
            [[ "${KEY2:-}" == "a=b" ]] || { echo "FAIL: KEY2 value with =" >&2; exit 1; }
            echo "loader literal semantics OK"
          )
          # Variables already in the environment win over the file.
          (
            cd "$tmp"
            set -euo pipefail
            export PLAIN=fromenv EMPTY=fromenv
            source "$GITHUB_WORKSPACE/scripts/lib-env.sh"
            load_env_file test.env
            [[ "${PLAIN:-}" == "fromenv" ]] || { echo "FAIL: environment must win (PLAIN)" >&2; exit 1; }
            [[ "${EMPTY:-}" == "fromenv" ]] || { echo "FAIL: environment must win (EMPTY)" >&2; exit 1; }
            echo "loader precedence OK"
          )

      - name: Validate Containerfile structure
        run: |
          set -euo pipefail
          # Required directives for a working image: base image, entrypoint copy
          # and exec bit, entrypoint array.
          grep -Eq '^FROM[[:space:]]+' Containerfile
          grep -Eq '^COPY[[:space:]]+entrypoint\.sh' Containerfile
          grep -Eq '^ENTRYPOINT[[:space:]]+\[' Containerfile
          test -x entrypoint.sh || { echo "entrypoint.sh is not executable" >&2; exit 1; }
          # No unknown directive keywords (mistyped instructions would silently
          # be treated as shell commands in a RUN).
          while read -r kw; do
            case "$kw" in
              FROM|RUN|COPY|ENTRYPOINT|USER) ;;
              *) echo "unknown Containerfile directive: $kw" >&2; exit 1 ;;
            esac
          done < <(awk '/^[A-Z]+[[:space:]]/ {print $1}' Containerfile | sort -u)
          echo "Containerfile OK"

      - name: Validate config XML (raw and rendered)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for f in ("config/serverconfig.tmpl.xml", "config/serveradmin_seed.xml"):
              ET.parse(f)
              print(f, "well-formed")
          PY
          # Render the template the same way entrypoint.sh does and require the
          # result to be valid XML with no leftover placeholders.
          sed -e 's|@TELNET_PASSWORD@|retest|g' \
              -e 's|@TELNET_PORT@|8087|g' \
              -e 's|@USERDATA_DIR@|/root/.local/share/7DaysToDie|g' \
              config/serverconfig.tmpl.xml > /tmp/serverconfig.xml
          if grep -q '@' /tmp/serverconfig.xml; then
            echo "unrendered template placeholder left in serverconfig.xml" >&2
            exit 1
          fi
          python3 -c 'import xml.etree.ElementTree as ET; ET.parse("/tmp/serverconfig.xml"); print("rendered serverconfig.xml OK")'
