name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check shell scripts
        run: |
          set -euo pipefail
          for f in entrypoint.sh start.sh stop.sh scripts/*.sh; do
            bash -n "$f"
            echo "bash -n OK: $f"
          done

      - name: Static-analyze shell scripts (shellcheck)
        run: |
          set -euo pipefail
          for f in entrypoint.sh start.sh stop.sh scripts/*.sh; do
            shellcheck -x "$f"
            echo "shellcheck OK: $f"
          done

      - name: Verify internal script references exist
        run: |
          set -euo pipefail
          for ref in $(grep -hoE 'scripts/[-a-z_]+\.sh' *.sh scripts/*.sh | sort -u); do
            test -f "$ref" || { echo "missing referenced script: $ref" >&2; exit 1; }
          done
          echo "all internal script references exist"

      - name: Test .env loader (scripts/lib-env.sh)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/test.env" <<'ENV'
          # comment line

          PLAIN=hello
          DOUBLE="double quoted"
          SINGLE='single'
          EVIL=$(touch ./pwned-marker)
          EMPTY=
          export EXPORTED=yes
          NOEQUALS
          KEY2=a=b
          ENV
          (
            cd "$tmp"
            set -euo pipefail
            source "$GITHUB_WORKSPACE/scripts/lib-env.sh"
            load_env_file test.env
            [[ "${PLAIN:-}" == "hello" ]] || { echo "FAIL: PLAIN" >&2; exit 1; }
            [[ "${DOUBLE:-}" == "double quoted" ]] || { echo "FAIL: DOUBLE quote stripping" >&2; exit 1; }
            [[ "${SINGLE:-}" == "single" ]] || { echo "FAIL: SINGLE quote stripping" >&2; exit 1; }
            [[ "${EVIL:-}" == '$(touch ./pwned-marker)' ]] || { echo "FAIL: EVIL must stay literal" >&2; exit 1; }
            [[ ! -e ./pwned-marker ]] || { echo "FAIL: .env value was executed" >&2; exit 1; }
            [[ -z "${EMPTY:-}" && -n "${EMPTY+x}" ]] || { echo "FAIL: EMPTY must be set but empty" >&2; exit 1; }
            [[ "${EXPORTED:-}" == "yes" ]] || { echo "FAIL: export prefix" >&2; exit 1; }
            [[ -z "${NOEQUALS+x}" ]] || { echo "FAIL: lines without = must be skipped" >&2; exit 1; }
            [[ "${KEY2:-}" == "a=b" ]] || { echo "FAIL: KEY2 value with =" >&2; exit 1; }
            echo "loader literal semantics OK"
          )
          (
            cd "$tmp"
            set -euo pipefail
            export PLAIN=fromenv EMPTY=fromenv
            source "$GITHUB_WORKSPACE/scripts/lib-env.sh"
            load_env_file test.env
            [[ "${PLAIN:-}" == "fromenv" ]] || { echo "FAIL: environment must win (PLAIN)" >&2; exit 1; }
            [[ "${EMPTY:-}" == "fromenv" ]] || { echo "FAIL: environment must win (EMPTY)" >&2; exit 1; }
            echo "loader precedence OK"
          )

      - name: Test webadmin password rules and digest (scripts/lib-env.sh)
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/lib-env.sh"
          WEBADMIN_PASSWORD='correct-horse-battery' check_webadmin_password
          for bad in 'a|b' 'a&b' 'a"b' "a'b" 'a<b' 'a>b' 'a\b' 'a$b' 'a`b'; do
            if ( WEBADMIN_PASSWORD="$bad" check_webadmin_password ) 2>/dev/null; then
              echo "FAIL: unsafe WEBADMIN_PASSWORD accepted: $bad" >&2; exit 1
            fi
          done
          if ( WEBADMIN_PASSWORD="$(printf 'a\tb')" check_webadmin_password ) 2>/dev/null; then
            echo "FAIL: control character accepted in WEBADMIN_PASSWORD" >&2; exit 1
          fi
          if ( WEBADMIN_PASSWORD=short check_webadmin_password ) 2>/dev/null; then
            echo "FAIL: short WEBADMIN_PASSWORD accepted" >&2; exit 1
          fi
          hex="$(printf '%s' admin | md5sum)"; hex="${hex%% *}"
          b64="$(printf '%b' "$(printf '%s' "$hex" | sed 's/\(..\)/\\x\1/g')" | base64)"
          [[ "$b64" == "ISMvKXpXpadDiUoOSoAfww==" ]] || { echo "FAIL: md5-base64 digest vector" >&2; exit 1; }
          echo "webadmin password rules OK"

      - name: Test telnet_session helper (scripts/lib-env.sh)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          port=18087
          python3 scripts/fake-telnet-server.py "$port" "$tmp/received.bin" &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          source "$GITHUB_WORKSPACE/scripts/lib-env.sh"
          for _ in $(seq 1 50); do
            if timeout 1 bash -c "exec 3<>/dev/tcp/127.0.0.1/${port}" 2>/dev/null; then break; fi
            sleep 0.1
          done
          out="$(telnet_session "$port" retest 'apm status' 10)"
          [[ "$out" == *"telnet ok"* ]] || { echo "FAIL: reply not relayed" >&2; exit 1; }
          printf 'retest\napm status\n' > "$tmp/expected.bin"
          cmp -s "$tmp/received.bin" "$tmp/expected.bin" || { echo "FAIL: wrong bytes on the wire (got $(od -c "$tmp/received.bin" | head -3))" >&2; exit 1; }
          echo "telnet_session OK"

      - name: Validate Containerfile structure
        run: |
          set -euo pipefail
          grep -Eq '^FROM[[:space:]]+' Containerfile
          grep -Eq '^COPY[[:space:]]+entrypoint\.sh' Containerfile
          grep -Eq '^COPY[[:space:]]+scripts/lib-env\.sh' Containerfile
          grep -Eq '^ENTRYPOINT[[:space:]]+\[' Containerfile
          test -x entrypoint.sh || { echo "entrypoint.sh is not executable" >&2; exit 1; }
          while read -r kw; do
            case "$kw" in
              FROM|RUN|COPY|ENTRYPOINT|USER) ;;
              *) echo "unknown Containerfile directive: $kw" >&2; exit 1 ;;
            esac
          done < <(awk '/^[A-Z]+[[:space:]]/ {print $1}' Containerfile | sort -u)
          echo "Containerfile OK"

      - name: Validate config XML (raw and rendered)
        run: |
          set -euo pipefail
          python3 scripts/check-config-xml.py \
            config/serverconfig.tmpl.xml config/serveradmin_seed.xml
          sed -e 's|@TELNET_PASSWORD@|retest|g' \
              -e 's|@TELNET_PORT@|8087|g' \
              -e 's|@USERDATA_DIR@|/root/.local/share/7DaysToDie|g' \
              config/serverconfig.tmpl.xml > /tmp/serverconfig.xml
          if grep -q '@' /tmp/serverconfig.xml; then
            echo "unrendered template placeholder left in serverconfig.xml" >&2
            exit 1
          fi
          python3 scripts/check-config-xml.py /tmp/serverconfig.xml

  coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install kcov
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends kcov
      - run: make coverage
      - run: python3 scripts/coverage_badge.py coverage.cobertura.xml "$RUNNER_TEMP/coverage.svg"
      - name: Publish the badge to the badges branch
        run: |
          set -euo pipefail
          url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git clone --depth 1 --branch badges "$url" badge-repo
          else
            git init -q -b badges badge-repo
          fi
          cp "$RUNNER_TEMP/coverage.svg" badge-repo/
          cd badge-repo
          git remote add origin "$url"
          git config user.name "hordeforge-ci"
          git config user.email "ci@hordeforge.noreply.github.com"
          git add coverage.svg
          git diff --cached --quiet || git commit -m "update coverage badge"
          git push origin badges
