# Static analysis for the Python helpers in scripts/. Enforced by `make lint`
# (local) and the ci workflow (blocking); the analyzer versions are pinned in
# the dev group below, locked with sha256 hashes in uv.lock, and installed by
# the same Makefile recipe (`uv sync --locked`) both times, so the two gates
# run identical rules.
#
# The project is virtual: nothing here is built or published, and the image
# version lives in VERSION. requires-python matches .python-version, the
# interpreter every gate runs on.
#
# License of the closure, read from each installed dist-info METADATA:
# ruff, mypy, mypy_extensions, ast-serialize, librt and pyyaml are MIT;
# typing_extensions is PSF-2.0; pathspec is MPL-2.0; yamllint is
# GPL-3.0-or-later. None of this ships: the venv is git-ignored and the image
# copies only entrypoint.sh and scripts/lib-env.sh, so the copyleft yamllint
# never reaches a distributed artifact and the MIT license of this repo is
# unaffected. Re-read the METADATA on every bump (`make sbom` lists it): a
# license line changing here is the signal to look again at whether the tool
# should run anywhere near a shipped image.
[project]
name = "7dtd-server-container"
version = "0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff==0.16.9",
    "mypy==2.3.1",
    "yamllint==1.38.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
# The interpreter version, owned by .python-version and read from there by the
# Makefile and the CI cache key. It also decides syntax the formatter emits
# (at this target `except A, B:` needs no parentheses), so it cannot lag the
# pin the gate actually runs on. [tool.mypy] below carries the same value.
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors incl. E501 hard cap at 100 columns
    "W",
    "F",    # pyflakes
    "B",    # bugbear: bug-prone patterns
    "UP",   # pyupgrade: keep syntax current
    "SIM",
    "I",    # import order
    "N",    # pep8-naming
    "C4",
    "INP",
    "DTZ",
    "EXE",  # shebang/exec-bit consistency
    "FURB",
    "PERF",
    "PLW", "PLE", "PLC",
    "FLY", "ICN", "PIE", "TID", "YTT", "RSE", "RET",
    "TC",   # flake8-type-checking: annotation-only imports out of runtime
    "BLE",  # blind `except Exception`, the swallow-everything catch
    "A",    # no shadowing builtins
    "SLF",  # no reaching into other modules' private names
    "C90",  # cyclomatic complexity ceiling (default 10)
    "ERA",  # no commented-out code left behind
    "ARG",  # unused parameters are usually forgotten call sites
    "ISC",  # implicit string concatenation across lines hides missing commas
    "PGH",  # blanket noqa / bare type-ignore are banned (suppression hygiene)
    "EM",   # exception messages are built before the raise site
    "PTH",  # pathlib APIs instead of os.path / builtin open
    "RUF",  # ruff-native: unused noqa, implicit Optional, ambiguous unicode
    "TRY",  # tryceratops: raise/raise-from/long messages outside the class
    "ASYNC",  # flake8-async: blocking calls in async def, unused awaitables
    "G",    # logging-format: f-strings and wrong arg counts in log calls
    "T10",  # debugger left behind (breakpoint, pdb)
    "INT",  # gettext instead of the stdlib string helpers
    "FIX",  # stray TODO/FIXME/XXX markers
    # flake8-bandit, rule by rule: the whole "S" group is off because the
    # harness calls subprocess by contract (S603) and starts the tools on PATH
    # (S607), which are decisions, not findings. The rest of the group is on
    # and clean, so eval/exec, pickle, yaml.load, unchecked TLS, an
    # unvalidated URL, and a 0.0.0.0 bind all fail the gate. The five rules
    # left off (S101 assert, S105 hardcoded string, S311 random, S314
    # ElementTree, S324 md5) land as each call site is audited.
    "S102", "S104", "S106", "S107", "S110", "S112",
    "S301", "S302", "S303", "S307", "S310", "S313",
    "S321", "S323", "S501", "S502", "S506",
    "S602", "S605", "S606", "S608", "S609",
]

[tool.ruff.lint.per-file-ignores]
# badge() embeds the SVG template as one long literal per element; wrapping
# would break the markup, so only there the 100-column cap cannot apply.
"scripts/coverage_badge.py" = ["E501"]

[tool.mypy]
strict = true
# Same single owner as [tool.ruff] target-version: .python-version.
python_version = "3.14"
files = ["scripts"]
# Not part of `strict`: flags code that can never run (dead branches after
# exhaustive returns, impossible conditions).
warn_unreachable = true
# Not part of `strict` either: pin down every explicit or import-carried `Any`
# so no untyped escape hatch can enter the codebase silently.
disallow_any_explicit = true
disallow_any_unimported = true
disallow_any_decorated = true
# Extra error codes outside `strict`, each proven clean on this tree:
# redundant conditions, always-true tests, reads of variables mypy cannot
# prove were assigned, incompatible mutable-attribute overrides, functions
# used in boolean context without being called, silent str/bytes coercion,
# narrowing assignments to non-subtypes, plus bare ignores/reveals that
# would dodge review.
enable_error_code = [
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
    "ignore-without-code",
    "unimported-reveal",
    "mutable-override",
    "truthy-function",
    "str-bytes-safe",
    "narrowed-type-not-subtype",
    "explicit-override",  # @override on overriding methods
    "redundant-cast",     # casts that assert nothing
    "unused-awaitable",   # awaited coroutines whose result is dropped
    "truthy-iterable",    # a collection used as a boolean
]
